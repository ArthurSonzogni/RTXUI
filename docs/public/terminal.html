<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-webgl@0.16.0/lib/xterm-addon-webgl.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    #terminal {
      width: max-content;
      height: max-content;
      padding: 12px;
      box-sizing: border-box;
    }
    .xterm {
      width: max-content !important;
      height: max-content !important;
    }
    .xterm-viewport {
      scrollbar-width: none !important;
    }
    .xterm-viewport::-webkit-scrollbar {
      display: none !important;
    }
    html.fullscreen, html.fullscreen body {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    html.fullscreen #terminal {
      width: 100% !important;
      height: 100% !important;
      padding: 8px !important;
      box-sizing: border-box !important;
    }
    html.fullscreen .xterm {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      const errStr = `\r\n\x1b[31;1m[ERROR]\x1b[0m ${message} at ${source}:${lineno}:${colno}\r\n`;
      if (window.xtermInstance) {
        window.xtermInstance.write(errStr);
      }
      console.error(errStr, error);
    };

    window.onunhandledrejection = function(event) {
      const errStr = `\r\n\x1b[31;1m[UNHANDLED REJECTION]\x1b[0m ${event.reason}\r\n`;
      if (window.xtermInstance) {
        window.xtermInstance.write(errStr);
      }
      console.error(errStr, event.reason);
    };

    // Prevent browser focus-scrolling bugs
    window.addEventListener('scroll', () => {
      window.scrollTo(0, 0);
    });

    window.addEventListener('load', () => {
      const termEl = document.getElementById('terminal');
      if (termEl) {
        termEl.addEventListener('scroll', () => {
          termEl.scrollTop = 0;
          termEl.scrollLeft = 0;
        });
      }

      document.fonts.ready.then(() => {
        const params = new URLSearchParams(window.location.search);
        const src = params.get('src');
        const isFullscreen = params.get('fullscreen') === '1' ||
                             params.get('fullscreen') === 'true' ||
                             params.get('fit') === '1' ||
                             params.get('fit') === 'true';
        let cols = parseInt(params.get('cols') || '80', 10);
        let rows = parseInt(params.get('rows') || '15', 10);

        const measureCharSize = () => {
          const span = document.createElement('span');
          span.style.fontFamily = '"JetBrains Mono", Fira Code, Cascadia Code, Consolas, "DejaVu Sans Mono", monospace';
          span.style.fontSize = '14px';
          span.style.position = 'absolute';
          span.style.left = '-9999px';
          span.style.top = '-9999px';
          span.style.visibility = 'hidden';
          span.textContent = 'WWWWWWWWWW';
          document.body.appendChild(span);
          const rect = span.getBoundingClientRect();
          const w = (rect.width / 10) || 8.4;
          const h = rect.height || 17;
          document.body.removeChild(span);
          return { width: w, height: h };
        };

        const charDim = measureCharSize();
        if (isFullscreen) {
          document.documentElement.classList.add('fullscreen');
          cols = Math.max(40, Math.floor((window.innerWidth - 16) / charDim.width));
          rows = Math.max(10, Math.floor((window.innerHeight - 16) / charDim.height));
        }

        const Terminal = window.Terminal;
        const xtermInstance = new Terminal({
          cols: cols,
          rows: rows,
          cursorBlink: true,
          convertEol: true,
          scrollback: 0,
          fontFamily: '"JetBrains Mono", Fira Code, Cascadia Code, Consolas, "DejaVu Sans Mono", monospace',
          fontSize: 14,
          theme: {
            background: '#0f172a',
            foreground: '#f8fafc',
            cursor: '#38bdf8'
          }
        });

        window.xtermInstance = xtermInstance;
        xtermInstance.open(document.getElementById('terminal'));

        try {
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext && (canvas.getContext('webgl2') || canvas.getContext('experimental-webgl2'));
          if (gl) {
            const WebglAddon = window.WebglAddon.WebglAddon;
            const webglAddon = new WebglAddon();
            xtermInstance.loadAddon(webglAddon);
          }
        } catch (e) {
          console.warn('WebGL addon failed to load, falling back to standard renderer:', e);
        }

        if (isFullscreen) {
          let resizeTimer = null;
          window.addEventListener('resize', () => {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
              const newCols = Math.max(40, Math.floor((window.innerWidth - 16) / charDim.width));
              const newRows = Math.max(10, Math.floor((window.innerHeight - 16) / charDim.height));
              if (newCols !== xtermInstance.cols || newRows !== xtermInstance.rows) {
                xtermInstance.resize(newCols, newRows);
                window.rtxui_columns = newCols;
                window.rtxui_lines = newRows;
                if (window.rtxui_on_input) {
                  window.rtxui_on_input(-1);
                } else if (window.rtxui_input_queue) {
                  window.rtxui_input_queue.push(-1);
                }
              }
            }, 30);
          });
        } else {
          // Report dimensions to parent iframe container
          const screenEl = document.querySelector('.xterm');
          if (screenEl && window.ResizeObserver) {
            const observer = new ResizeObserver(() => {
              const width = screenEl.offsetWidth + 24 + 16;
              const height = screenEl.offsetHeight + 24 + 4;
              window.parent.postMessage({
                type: 'rtxui-terminal-resize',
                width: width,
                height: height
              }, '*');
            });
            observer.observe(screenEl);
          }
        }

        window.rtxui_columns = xtermInstance.cols;
        window.rtxui_lines = xtermInstance.rows;
        window.rtxui_input_queue = [];

        const textEncoder = new TextEncoder();
        xtermInstance.onData((data) => {
          const bytes = textEncoder.encode(data);
          for (let i = 0; i < bytes.length; ++i) {
            const byte = bytes[i];
            if (window.rtxui_on_input) {
              const cb = window.rtxui_on_input;
              cb(byte);
            } else {
              window.rtxui_input_queue.push(byte);
            }
          }
        });

        window.rtxui_on_output = (str) => {
          xtermInstance.write(str);
        };

        window.Module = {
          preRun: [],
          postRun: [],
          print: (text) => {
            console.log("[WASM stdout]", text);
          },
          printErr: (text) => {
            console.error("[WASM stderr]", text);
            xtermInstance.write(`\r\n\x1b[31m[WASM ERROR]\x1b[0m ${text}\r\n`);
          },
          setStatus: (text) => {
            console.log("[WASM status]", text);
          },
          locateFile: (path, prefix) => {
            if (path.endsWith('.wasm')) {
              if (src) {
                const baseDir = src.substring(0, src.lastIndexOf('/') + 1);
                return baseDir + path;
              }
              return 'wasm/' + path;
            }
            return prefix + path;
          }
        };

        if (src) {
          const script = document.createElement('script');
          script.src = src;
          script.onerror = (err) => {
            const errStr = `\r\n\x1b[31;1m[ERROR]\x1b[0m Failed to load script: ${src}\r\n`;
            xtermInstance.write(errStr);
            console.error(errStr, err);
          };
          document.body.appendChild(script);
        } else {
          xtermInstance.write("\x1b[31m[ERROR] No WASM source script provided (missing 'src' query param)\x1b[0m\r\n");
        }
      });
    });
  </script>
</body>
</html>
