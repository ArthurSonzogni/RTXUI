# Sample workflow for building and deploying a VitePress site to GitHub Pages
name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # The WASM step rebuilds every example on each push and dominates this
      # job's runtime. CMake picks ccache up automatically (see CMakeLists),
      # so caching its directory turns most of that into cache hits.
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: docs-wasm-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            docs-wasm-ccache-${{ runner.os }}-

      - name: Configure and build WebAssembly
        run: |
          mkdir -p build_wasm
          cd build_wasm
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release -DRTXUI_BUILD_EXAMPLES=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build . --parallel

      - name: Copy WASM artifacts to docs
        run: |
          mkdir -p docs/public/wasm
          cp build_wasm/rtxui_example_*.js docs/public/wasm/
          cp build_wasm/rtxui_example_*.wasm docs/public/wasm/

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build with VitePress
        run: npm run build
        working-directory: docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Deployment job. Skipped while the repository is private: GitHub Pages
  # cannot publish a private repo, and the deploy API returns 404. The build
  # job above still runs, so a broken docs build is caught either way.
  deploy:
    if: ${{ !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
