name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            build_type: Release
            sanitize: "OFF"
            cc: gcc-14
            cxx: g++-14
          - name: Clang Release
            build_type: Release
            sanitize: "OFF"
            cc: clang-20
            cxx: clang++-20
          - name: ASAN+UBSAN Debug
            build_type: Debug
            sanitize: "ON"
            cc: gcc-14
            cxx: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          if [[ "${{ matrix.cc }}" == clang* ]]; then
            # apt.llvm.org: prebuilt packages, much faster than building or
            # using a setup action.
            wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          else
            sudo apt-get install -y g++-14
          fi

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRTXUI_BUILD_TESTS=ON
          -DRTXUI_BUILD_BENCHMARKS=OFF
          -DRTXUI_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  benchmarks:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRTXUI_BUILD_TESTS=OFF
          -DRTXUI_BUILD_BENCHMARKS=ON

      - name: Build benchmarks
        run: >
          cmake --build build
          --target rtxui_benchmark rtxui_layout_benchmark
          rtxui_steady_state_benchmark rtxui_xml_benchmark

      # Smoke-run each benchmark: catches compile/runtime breakage. We do NOT
      # gate on timing — wall-clock numbers vary too much across shared CI
      # runners to be a reliable regression signal (see benchmarks/README.md).
      - name: Run benchmarks
        run: |
          for bench in rtxui_benchmark rtxui_layout_benchmark rtxui_steady_state_benchmark rtxui_xml_benchmark; do
            echo "=== $bench ==="
            ./build/$bench
          done
