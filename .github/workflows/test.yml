name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            os: ubuntu-latest
            build_type: Release
            sanitize: "OFF"
            cc: gcc-14
            cxx: g++-14
          - name: Clang Release
            os: ubuntu-latest
            build_type: Release
            sanitize: "OFF"
            cc: clang-20
            cxx: clang++-20
          - name: ASAN+UBSAN Debug
            os: ubuntu-latest
            build_type: Debug
            sanitize: "ON"
            cc: gcc-14
            cxx: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build ccache
          if [[ "${{ matrix.cc }}" == clang* ]]; then
            wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          else
            sudo apt-get install -y g++-14
          fi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.name }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.name }}-${{ runner.os }}-

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRTXUI_BUILD_TESTS=ON
          -DRTXUI_BUILD_BENCHMARKS=OFF
          -DRTXUI_SANITIZE=${{ matrix.sanitize }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  # Gated to PRs and manual triggers to preserve private runner quota (10x multiplier on macOS)
  test-macos:
    name: macOS AppleClang Release
    runs-on: macos-latest
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (macOS)
        run: brew install ninja ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-macos-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-macos-${{ runner.os }}-

      - name: Configure
        env:
          CC: clang
          CXX: clang++
          CCACHE_DIR: /Users/runner/.cache/ccache
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRTXUI_BUILD_TESTS=ON
          -DRTXUI_BUILD_BENCHMARKS=OFF
          -DRTXUI_SANITIZE=OFF
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  benchmarks:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-benchmarks-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-benchmarks-${{ runner.os }}-

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRTXUI_BUILD_TESTS=OFF
          -DRTXUI_BUILD_BENCHMARKS=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build benchmarks
        run: >
          cmake --build build
          --target rtxui_benchmark rtxui_layout_benchmark
          rtxui_steady_state_benchmark rtxui_xml_benchmark
          rtxui_nesting_benchmark

      # Smoke-run each benchmark: catches compile/runtime breakage.
      - name: Run benchmarks
        run: |
          for bench in rtxui_benchmark rtxui_layout_benchmark rtxui_steady_state_benchmark rtxui_xml_benchmark rtxui_nesting_benchmark; do
            echo "=== $bench ==="
            ./build/$bench
          done
