name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            os: ubuntu-latest
            build_type: Release
            sanitize: "OFF"
            cc: gcc-14
            cxx: g++-14
          - name: Clang Release
            os: ubuntu-latest
            build_type: Release
            sanitize: "OFF"
            cc: clang-20
            cxx: clang++-20
          - name: ASAN+UBSAN Debug
            os: ubuntu-latest
            build_type: Debug
            sanitize: "ON"
            cc: gcc-14
            cxx: g++-14
          # Projects that fetch RTXUI may build it as a unity build, which
          # merges the anonymous namespaces of several .cpp files.
          - name: GCC Unity Release
            os: ubuntu-latest
            build_type: Release
            sanitize: "OFF"
            unity: "ON"
            cc: gcc-14
            cxx: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build ccache
          if [[ "${{ matrix.cc }}" == clang* ]]; then
            wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          else
            sudo apt-get install -y g++-14
          fi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.name }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.name }}-${{ runner.os }}-

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRTXUI_BUILD_TESTS=ON
          -DRTXUI_BUILD_BENCHMARKS=OFF
          -DRTXUI_SANITIZE=${{ matrix.sanitize }}
          -DCMAKE_UNITY_BUILD=${{ matrix.unity || 'OFF' }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  # What a user of the package does: install RTXUI, then build an app against
  # it with find_package(), pkg-config and FetchContent.
  install:
    name: Install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux static
            os: ubuntu-latest
            cmake_args: ""
          - name: Linux shared
            os: ubuntu-latest
            cmake_args: "-DBUILD_SHARED_LIBS=ON"
          - name: macOS static
            os: macos-latest
            cmake_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14 pkg-config

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkgconf

      - name: Install and consume
        env:
          CC: ${{ runner.os == 'Linux' && 'gcc-14' || 'clang' }}
          CXX: ${{ runner.os == 'Linux' && 'g++-14' || 'clang++' }}
        run: scripts/verify_install.sh ${{ matrix.cmake_args }}

  # Runs on every push: macOS minutes are free for a public repository, and
  # libc++ catches missing includes libstdc++ supplies transitively.
  test-macos:
    name: macOS AppleClang Release
    runs-on: macos-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (macOS)
        run: brew install ninja ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-macos-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-macos-${{ runner.os }}-

      - name: Configure
        env:
          CC: clang
          CXX: clang++
          CCACHE_DIR: /Users/runner/.cache/ccache
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRTXUI_BUILD_TESTS=ON
          -DRTXUI_BUILD_BENCHMARKS=OFF
          -DRTXUI_SANITIZE=OFF
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # C++26 reflection: GCC 16 builds RTXUI's tests and examples with
  # reflection, which no other job does. Fails if CMake did not enable it: the
  # probe once failed under every compiler, and the reflection code went
  # unbuilt unnoticed.
  test-reflection:
    name: GCC 16 Reflection
    runs-on: ubuntu-latest
    container: gcc:16
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: apt-get update && apt-get install -y cmake ninja-build pkg-config

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DRTXUI_BUILD_TESTS=ON -DRTXUI_BUILD_EXAMPLES=ON \
            -DRTXUI_BUILD_BENCHMARKS=OFF | tee configure.log
          grep -q "C++26 Reflection enabled" configure.log ||
            { echo "::error::GCC 16 did not enable C++26 reflection"; exit 1; }

      - name: Build
        run: cmake --build build

      # The PTY sweep of the examples takes minutes and does not depend on
      # reflection; the other Linux jobs run it.
      - name: Test
        run: ctest --test-dir build --output-on-failure -E smoke_examples

      # The installed library is C++23 and asks nothing of its users; an app
      # compiled with reflection must still get it.
      - name: Reflection app against the installed library
        env:
          APP_REFLECTION_FLAG: -freflection
        run: scripts/verify_install.sh

  # The `rtxui` C++ module: every example, rewritten to `import rtxui;`, must
  # draw the same snapshot as its header-based build. See cmake/modules.cmake.
  test-module:
    name: Clang Module
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build ccache
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y clang-tools-20

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-module-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-module-${{ runner.os }}-

      - name: Configure
        env:
          CC: clang-20
          CXX: clang++-20
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRTXUI_BUILD_MODULE=ON
          -DRTXUI_BUILD_EXAMPLES=ON
          -DRTXUI_BUILD_TESTS=ON
          -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=clang-scan-deps-20
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -R snapshot_module_examples

  benchmarks:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-benchmarks-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-benchmarks-${{ runner.os }}-

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRTXUI_BUILD_TESTS=OFF
          -DRTXUI_BUILD_BENCHMARKS=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build benchmarks
        run: >
          cmake --build build
          --target rtxui_benchmark rtxui_layout_benchmark
          rtxui_steady_state_benchmark rtxui_xml_benchmark
          rtxui_transition_benchmark rtxui_nesting_benchmark

      # Smoke-run each benchmark: catches compile/runtime breakage. Strict, so a
      # stylesheet the engine drops fails here rather than timing an unstyled
      # tree.
      - name: Run benchmarks
        env:
          RTXUI_STRICT: 1
        run: |
          for bench in rtxui_benchmark rtxui_layout_benchmark rtxui_steady_state_benchmark rtxui_xml_benchmark rtxui_transition_benchmark rtxui_nesting_benchmark; do
            echo "=== $bench ==="
            ./build/$bench
          done

  test-wasm:
    name: WebAssembly Build Check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Cache ccache and emscripten
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.emscripten_cache
          key: ccache-wasm-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-wasm-${{ runner.os }}-

      - name: Configure
        run: |
          mkdir -p build_wasm
          cd build_wasm
          emcmake cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DRTXUI_BUILD_EXAMPLES=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build WASM Target
        run: cmake --build build_wasm --target rtxui_example_playground --parallel
