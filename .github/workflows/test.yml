name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            sanitize: "OFF"
          - name: ASAN+UBSAN Debug
            build_type: Debug
            sanitize: "ON"
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRTXUI_BUILD_TESTS=ON
          -DRTXUI_BUILD_BENCHMARKS=OFF
          -DRTXUI_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
