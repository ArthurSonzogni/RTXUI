name: Bazel

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: bazel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the unit tests through BUILD.bazel, builds the examples, then builds an app depending on
  # the `rtxui` module, as a Bazel user would (packaging/bazel/test_module/).
  bazel:
    name: Bazel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc-14
          # The Bazel Central Registry's presubmit also runs Bazel 8.
          - name: Linux GCC, Bazel 8
            os: ubuntu-latest
            cc: gcc-14
            bazel: 8.x
          - name: macOS Clang
            os: macos-latest
            cc: clang
          # The Bazel Central Registry's presubmit builds on Windows too.
          - name: Windows MSVC
            os: windows-latest
          # The oldest MSVC we support: the one the Bazel Central Registry's
          # Windows machines have (Visual Studio 2022 17.9).
          - name: Windows MSVC 14.39
            os: windows-latest
            msvc: '14.39'
    env:
      CC: ${{ matrix.cc }}
      # Overrides .bazelversion when set.
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-14

      # Adds the older MSVC toolset beside the runner's own, and has Bazel
      # use it.
      - name: Install MSVC ${{ matrix.msvc }}
        if: matrix.msvc
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $component = "Microsoft.VisualStudio.Component.VC.${{ matrix.msvc }}.17.9.x86.x64"
          $installer = Start-Process -Wait -PassThru `
            -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" `
            -ArgumentList "modify --installPath `"$vs`" --add $component --quiet --norestart --nocache"
          if ($installer.ExitCode -ne 0) { exit $installer.ExitCode }
          $version = (Get-ChildItem "$vs\VC\Tools\MSVC" -Filter "${{ matrix.msvc }}.*" | Select-Object -First 1).Name
          if (-not $version) { Write-Error "MSVC ${{ matrix.msvc }} is not installed"; exit 1 }
          "BAZEL_VC_FULL_VERSION=$version" >> $env:GITHUB_ENV

      # The runners ship bazelisk as `bazel`; it fetches the version named in
      # .bazelversion.
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ matrix.name }}-

      - name: Test
        run: >
          bazel test //... --test_output=errors
          --disk_cache=$HOME/.cache/bazel-disk
          --repository_cache=$HOME/.cache/bazel-repo

      - name: Consume the module
        working-directory: packaging/bazel/test_module
        run: >
          bazel test //:app_test --test_output=all
          --disk_cache=$HOME/.cache/bazel-disk
          --repository_cache=$HOME/.cache/bazel-repo
