name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build & Install Debug
        run: |
          cmake -B build_debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build_debug
          cmake --install build_debug --prefix install

      - name: Build & Install Release
        run: |
          cmake -B build_release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build_release
          cmake --install build_release --prefix install

      - name: Package
        run: tar -czf rtxui-linux-x64.tar.gz -C install .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtxui-linux-x64
          path: rtxui-linux-x64.tar.gz

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Build & Install Debug
        run: |
          cmake -B build_debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build_debug
          cmake --install build_debug --prefix install

      - name: Build & Install Release
        run: |
          cmake -B build_release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build_release
          cmake --install build_release --prefix install

      - name: Package
        run: tar -czf rtxui-macos-universal.tar.gz -C install .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtxui-macos-universal
          path: rtxui-macos-universal.tar.gz

  publish:
    name: Publish release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            rtxui-linux-x64.tar.gz
            rtxui-macos-universal.tar.gz
