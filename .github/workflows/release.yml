name: Release

# Pushing a v* tag builds the packages, checks them, and publishes the
# release. Run by hand (workflow_dispatch), it builds and checks the packages
# without publishing anything: a dry run.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The archive holds Debug and Release; the .deb and .rpm, Release only, each
  # built for its distribution's library directory. See cmake/package.cmake.
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache g++-14 rpm

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-release-linux-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-release-linux-${{ matrix.arch }}-

      - name: Archive (Debug and Release)
        run: |
          cmake -B build -G "Ninja Multi-Config" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --config Debug
          cmake --build build --config Release
          cpack --config build/CPackConfig.cmake -G TGZ -C "Debug;Release" -B dist

      - name: Debian package
        run: |
          cmake -B build_deb -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build_deb
          cpack --config build_deb/CPackConfig.cmake -G DEB -B dist

      - name: RPM package
        run: |
          cmake -B build_rpm -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib64 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build_rpm
          cpack --config build_rpm/CPackConfig.cmake -G RPM -B dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ matrix.arch }}
          path: |
            dist/rtxui-*.tar.gz
            dist/*.deb
            dist/*.rpm

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    env:
      CC: clang
      CXX: clang++
      CCACHE_DIR: /Users/runner/.cache/ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install ninja ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-release-macos-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-release-macos-${{ runner.os }}-

      - name: Archive (Debug and Release)
        run: |
          cmake -B build -G "Ninja Multi-Config" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --config Debug
          cmake --build build --config Release
          cpack --config build/CPackConfig.cmake -G TGZ -C "Debug;Release" -B dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: dist/rtxui-*.tar.gz

  # MSVC, with its default runtime (/MD, /MDd): rtxui.lib and rtxuid.lib.
  # MinGW (UCRT64, as MSYS2 ships it): librtxui.a and librtxuid.a, in an
  # archive of its own, since neither compiler links the other's C++ library.
  windows:
    name: Windows ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: x64 (MSVC)
            id: x64-msvc
            runner: windows-latest
            arch: x64
          - name: arm64 (MSVC)
            id: arm64-msvc
            runner: windows-11-arm
            arch: arm64
          - name: x64 (MinGW)
            id: x64-mingw
            runner: windows-latest
            msys2: true
    defaults:
      run:
        shell: ${{ matrix.msys2 && 'msys2 {0}' || 'pwsh' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (MSVC)
        if: ${{ !matrix.msys2 }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install toolchain (MinGW)
        if: ${{ matrix.msys2 }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Archive (Debug and Release)
        env:
          CC: ${{ !matrix.msys2 && 'cl' || '' }}
          CXX: ${{ !matrix.msys2 && 'cl' || '' }}
        run: |
          cmake -B build -G "Ninja Multi-Config"
          cmake --build build --config Debug
          cmake --build build --config Release
          cpack --config build/CPackConfig.cmake -G ZIP -C "Debug;Release" -B dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows-${{ matrix.id }}
          path: dist/rtxui-*.zip

  # Unpacks each archive, then builds an app against it with find_package(),
  # in Debug and in Release, and runs it.
  check-archives:
    name: Use the ${{ matrix.artifact }} archive
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x64
            runner: ubuntu-latest
            cxx: g++-14
          - artifact: linux-arm64
            runner: ubuntu-24.04-arm
            cxx: g++-14
          - artifact: macos
            runner: macos-latest
            cxx: clang++
          - artifact: windows-x64-msvc
            runner: windows-latest
            arch: x64
            cxx: cl
          - artifact: windows-arm64-msvc
            runner: windows-11-arm
            arch: arm64
            cxx: cl
          - artifact: windows-x64-mingw
            runner: windows-latest
            msys2: true
    defaults:
      run:
        shell: ${{ matrix.msys2 && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ matrix.artifact }}
          path: dist

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install toolchain (MSVC)
        if: ${{ matrix.arch }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install toolchain (MinGW)
        if: ${{ matrix.msys2 }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Build and run an app against it
        env:
          CXX: ${{ matrix.cxx }}
          RTXUI_STRICT: 1
        run: |
          archive=$(ls dist/rtxui-*.tar.gz dist/rtxui-*.zip 2>/dev/null || true)
          (cd dist && cmake -E tar xf "$(basename "$archive")")
          prefix=$(cd dist && pwd)/$(basename "$archive" | sed -E 's/\.(tar\.gz|zip)$//')
          mkdir app
          cp packaging/bazel/test_module/main.cpp app/
          cat > app/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(app LANGUAGES CXX)
          find_package(rtxui CONFIG REQUIRED)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE rtxui::rtxui)
          EOF
          for config in Debug Release; do
            cmake -S app -B "app/build-$config" -G Ninja \
              -DCMAKE_BUILD_TYPE=$config -DCMAKE_PREFIX_PATH="$prefix"
            cmake --build "app/build-$config"
            "./app/build-$config/app"
          done

  # Installs each Linux package with its distribution's package manager, then
  # builds an app against it with find_package() and with pkg-config.
  check-linux-packages:
    name: Install the ${{ matrix.arch }} ${{ matrix.package }} on ${{ matrix.image }}
    needs: linux
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        package: [.deb, .rpm]
        include:
          - package: .deb
            image: ubuntu:24.04
            install: |
              apt-get update
              apt-get install -y ./*.deb g++-14 cmake ninja-build pkg-config
            cxx: g++-14
          - package: .rpm
            image: fedora:latest
            install: dnf install -y ./*.rpm gcc-c++ cmake ninja-build pkgconf-pkg-config
            cxx: g++
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages-linux-${{ matrix.arch }}

      - name: Install the package
        run: ${{ matrix.install }}

      - name: Build and run an app against it
        env:
          CXX: ${{ matrix.cxx }}
          RTXUI_STRICT: 1
        run: |
          mkdir app
          cp packaging/bazel/test_module/main.cpp app/
          cat > app/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(app LANGUAGES CXX)
          find_package(rtxui CONFIG REQUIRED)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE rtxui::rtxui)
          EOF
          cmake -S app -B app/build -G Ninja
          cmake --build app/build
          ./app/build/app
          "$CXX" -std=c++23 app/main.cpp $(pkg-config --cflags --libs rtxui) -o app/pkg-config-app
          ./app/pkg-config-app

  # The tarball registries (vcpkg, Conan, Meson, Homebrew, ...) build from,
  # with a checksum they can pin: GitHub's own archives are not guaranteed to
  # stay byte-identical.
  source:
    name: Source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/verify_version.py "${{ github.ref_name }}"

      - name: Package
        run: |
          version=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          git archive --format=tar.gz --prefix="rtxui-$version/" \
            -o "rtxui-$version.tar.gz" HEAD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtxui-source
          path: rtxui-[0-9]*.tar.gz

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [source, linux, macos, windows, check-linux-packages, check-archives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The notes are written by hand, one file per tag: the auto-generated
      # ones list pull requests, and changes reach main without them.
      - uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: .github/release-notes

      - name: Find the release notes
        run: |
          notes="repo/.github/release-notes/${{ github.ref_name }}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing $notes: write the release notes first."
            exit 1
          fi
          echo "NOTES=$notes" >> "$GITHUB_ENV"

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.NOTES }}
          files: dist/*
