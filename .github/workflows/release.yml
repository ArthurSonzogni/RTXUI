name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache g++-14

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-release-linux-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-release-linux-${{ runner.os }}-

      - name: Build & Install Debug
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -B build_debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build_debug
          cmake --install build_debug --prefix install

      - name: Build & Install Release
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -B build_release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build_release
          cmake --install build_release --prefix install

      - name: Package
        run: tar -czf rtxui-linux-x64.tar.gz -C install .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtxui-linux-x64
          path: rtxui-linux-x64.tar.gz

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (macOS)
        run: brew install ninja ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-release-macos-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-release-macos-${{ runner.os }}-

      - name: Build & Install Debug
        env:
          CC: clang
          CXX: clang++
          CCACHE_DIR: /Users/runner/.cache/ccache
        run: |
          cmake -B build_debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build_debug
          cmake --install build_debug --prefix install

      - name: Build & Install Release
        env:
          CC: clang
          CXX: clang++
          CCACHE_DIR: /Users/runner/.cache/ccache
        run: |
          cmake -B build_release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build_release
          cmake --install build_release --prefix install

      - name: Package
        run: tar -czf rtxui-macos-universal.tar.gz -C install .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtxui-macos-universal
          path: rtxui-macos-universal.tar.gz

  publish:
    name: Publish release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            rtxui-linux-x64.tar.gz
            rtxui-macos-universal.tar.gz
