# Detect ABI changes with libabigail's abidiff.
#
# rtxui is built as a shared library (Debug) at a baseline commit and at HEAD,
# and the two are compared. Reports go to the run's step summary.
#
# - pull_request: baseline is the merge-base with the target branch; an
#   incompatible ABI change fails the job.
# - push to main: baseline is the previous commit; an incompatible ABI change
#   only emits a warning annotation (breaking changes on main are allowed,
#   this job exists to make them visible, not to forbid them).
# - push of a release tag vX.Y.Z with Z > 0: baseline is the previous
#   vX.Y.* tag; an incompatible ABI change fails the job. A patch release
#   keeps the ABI (docs/guide/compatibility.md); vX.Y.0 starts a new soname
#   and is not compared.
name: ABI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: abi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abidiff:
    name: abidiff vs baseline
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build abigail-tools

      - name: Pick baseline commit
        id: baseline
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            baseline=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            minor="${tag%.*}"
            # The highest earlier tag of the same vX.Y series, if any.
            baseline=$(git tag --list "$minor.*" --sort=-version:refname |
                       { grep -vx "$tag" || true; } |
                       while read -r t; do
                         if [ "$(printf '%s\n' "$t" "$tag" |
                                 sort -V | tail -1)" = "$tag" ]; then
                           echo "$t"; break
                         fi
                       done)
          else
            baseline="${{ github.event.before }}"
            if ! git cat-file -e "$baseline^{commit}" 2>/dev/null; then
              # Force push or new branch: fall back to the parent commit.
              baseline=$(git rev-parse HEAD^ 2>/dev/null || true)
            fi
          fi
          if [ -z "$baseline" ]; then
            echo "No baseline commit; skipping ABI comparison."
          else
            echo "Baseline: $(git log -1 --oneline "$baseline")"
          fi
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"

      - name: Build baseline and head libraries
        if: steps.baseline.outputs.sha != ''
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          # Build the real shared library rather than synthesising one from the
          # static archive. The library is compiled with hidden visibility, and
          # generate_export_header expands RTXUI_EXPORT to nothing for a static
          # target -- whole-archiving that produced a .so with almost none of
          # the actual ABI in it, so the comparison was measuring noise.
          build() { # <source-dir> <build-dir> <output.so>
            cmake -S "$1" -B "$2" -G Ninja \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_BUILD_TYPE=Debug \
              -DRTXUI_BUILD_TESTS=OFF \
              -DRTXUI_BUILD_EXAMPLES=OFF \
              -DRTXUI_BUILD_BENCHMARKS=OFF
            cmake --build "$2" --target rtxui
            # Prefer the versioned file the SONAME points at. A baseline from
            # before the two targets were merged calls the real library
            # rtxui_lib; its librtxui is an empty wrapper, so look there first.
            lib=$(ls "$2"/librtxui_lib*.so.*.*.* "$2"/librtxui_lib*.so \
                     "$2"/librtxui*.so.*.*.* "$2"/librtxui*.so 2>/dev/null | head -1)
            if [ -z "$lib" ]; then
              echo "No shared rtxui in $2 (baseline predates shared support)."
              return 1
            fi
            cp "$lib" "$3"
          }
          git worktree add abi-baseline "${{ steps.baseline.outputs.sha }}"
          # A baseline from before shared-library support cannot be measured;
          # skip rather than report a bogus difference.
          if ! build abi-baseline build-baseline librtxui-baseline.so; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          build . build-head librtxui-head.so

      - name: Compare ABI
        if: steps.baseline.outputs.sha != ''
        run: |
          set +e
          abidiff \
            --suppressions .github/abidiff.suppr \
            --headers-dir1 abi-baseline/include \
            --headers-dir2 include \
            librtxui-baseline.so librtxui-head.so > abi-report.txt 2>&1
          status=$?
          set -e
          cat abi-report.txt

          # abidiff's exit status is a bit-field:
          #   1 = tool error, 2 = usage error,
          #   4 = ABI changed, 8 = the change is incompatible.
          if [ $((status & 3)) -ne 0 ]; then
            echo "abidiff failed to run (exit $status)" >&2
            exit "$status"
          fi

          {
            if [ "$status" -eq 0 ]; then
              echo "### ✅ No ABI change"
            elif [ $((status & 8)) -ne 0 ]; then
              echo "### ❌ Incompatible ABI change"
            else
              echo "### ⚠️ Compatible ABI change (additions only)"
            fi
            echo ""
            echo "Baseline: \`$(git log -1 --oneline "${{ steps.baseline.outputs.sha }}")\`"
            echo ""
            echo "<details><summary>abidiff report</summary>"
            echo ""
            echo '```'
            cat abi-report.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ $((status & 8)) -ne 0 ]; then
            if [ "${{ github.event_name }}" = "pull_request" ] ||
               [ "${{ github.ref_type }}" = "tag" ]; then
              exit 1
            fi
            echo "::warning::Incompatible ABI change since ${{ steps.baseline.outputs.sha }} (see the run summary)."
          fi
