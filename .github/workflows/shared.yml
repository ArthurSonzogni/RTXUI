# Verifies the shared library on every supported platform.
#
# A shared build exercises things a static one cannot: symbol visibility (the
# library is built with -fvisibility=hidden, so anything a consumer needs must
# carry RTXUI_EXPORT), the self-registration of the built-in components from
# static initialisers without the whole-archive trick, and whether the
# installed package is actually consumable.
name: Shared library

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC shared
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
          - name: Linux Clang shared
            os: ubuntu-latest
            cc: clang-20
            cxx: clang++-20
          - name: macOS AppleClang shared
            os: macos-latest
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          if [[ "${{ matrix.cc }}" == clang* ]]; then
            wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          else
            sudo apt-get install -y g++-14
          fi

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (BUILD_SHARED_LIBS=ON)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build -G Ninja
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DRTXUI_BUILD_TESTS=ON
          -DRTXUI_BUILD_EXAMPLES=ON
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build

      - name: Confirm a shared library was produced
        run: |
          ls build/librtxui_lib.* build/librtxui.*
          # A static archive here would mean BUILD_SHARED_LIBS was ignored.
          if ls build/librtxui_lib.a >/dev/null 2>&1; then
            echo "::error::BUILD_SHARED_LIBS=ON still produced a static archive"
            exit 1
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build

      # The point of the whole job: a project that only has the installed
      # package must compile, link and run against the shared library. This is
      # what catches a public symbol that was never marked RTXUI_EXPORT.
      - name: Consume the installed package
        shell: bash
        run: |
          mkdir -p consumer && cd consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(consumer LANGUAGES CXX)
          find_package(rtxui CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE rtxui::rtxui)
          EOF
          cat > main.cpp <<'EOF'
          #include <rtxui/rtxui.hpp>
          #include "rtxui/base/task_runner.hpp"
          using namespace rtxui;
          class App : public Component<App> {
           public:
            int count = 0;
            void Bump() { count++; }
            std::string_view view = R"html(
              <div class="c"><h1>hi {count}</h1><button onclick="Bump">go</button></div>
              <style>.c { display: block; color: rgb(1,2,3); }</style>
            )html";
            App() { Bind(count); Bind(Bump); }
          };
          int main() {
            auto app = Ref<App>::New();
            app->Mount();
            // Touches the DOM and the task runner, both of which a real
            // application uses and neither of which lives in rtxui.hpp.
            if (!app->Root()->QuerySelector(".c")) return 1;
            return 0;
          }
          EOF
          cmake -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          if [ "${{ runner.os }}" = "macOS" ]; then
            DYLD_LIBRARY_PATH="${{ github.workspace }}/install/lib" ./build/consumer
          else
            LD_LIBRARY_PATH="${{ github.workspace }}/install/lib" ./build/consumer
          fi

      - name: Confirm the consumer links the shared library
        shell: bash
        run: |
          cd consumer
          if [ "${{ runner.os }}" = "macOS" ]; then
            otool -L build/consumer | grep rtxui
          else
            ldd build/consumer | grep rtxui
          fi
